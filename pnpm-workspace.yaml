packages:
  - apps/*
  - packages/*
  - e2e

# Shared dependency versions (pnpm catalogs) — single source of truth so every
# workspace resolves the same major versions (see ADR-0001/ADR-0002).
catalog:
  # TypeScript 5.x + Vite 7 pinned per ADR-0002 (frontend stack)
  typescript: ^5.9.3
  vite: ^7.3.6
  '@vitejs/plugin-react': ^5.2.0
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^22.0.0

  # Styling (Tailwind CSS 4, CSS-first)
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # Extension (WXT, MV3)
  wxt: ^0.21.4
  '@wxt-dev/module-react': 1.2.1

  # Engine (Hono on Node 22)
  hono: ^4.13.8
  '@hono/node-server': ^2.1.1
  esbuild: ^0.28.2
  tsx: ^4.23.15
  ws: ^8.21.3
  '@types/ws': ^8.18.1

  # App state / data fetching
  zustand: ^5.0.15

  # Testing
  vitest: ^5.0.1
  jsdom: ^30.1.1
  '@testing-library/react': ^16.3.3
  fake-indexeddb: ^6.0.0
  '@playwright/test': ^1.63.0

  # Lint / format / git hooks
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  typescript-eslint: ^8.70.1
  globals: ^17.12.0
  prettier: ^3.9.9
  husky: ^9.1.7
  lint-staged: ^17.5.1
