name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Nightly: dependency advisories appear without a push (code quality plan).
  schedule:
    - cron: '17 3 * * *'

env:
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine normalizes media with ffmpeg; without it its media tests skip.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Docs link check
        run: pnpm lint:links

      - name: Versions and changelog agree
        run: node scripts/release.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      # github-actions reporter: each failing test becomes an annotation with its name and error.
      - name: Unit tests
        run: pnpm -r --filter "!@sublight/e2e" exec vitest run --reporter=default --reporter=github-actions

      # Playwright is a dependency of the e2e package, not the root.
      - name: Coverage floors (core, overlay, job queue)
        run: pnpm coverage

      - name: Dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright browsers (Chromium + deps)
        run: pnpm --filter @sublight/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Sync-accuracy corpus report
        run: pnpm sync:measure

      - name: E2E (Chromium, headless)
        run: pnpm e2e

      - name: E2E (extension, headless via chromium channel)
        run: pnpm e2e:extension

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
